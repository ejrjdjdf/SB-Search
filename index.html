<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SB Search // Secure Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="browser-top">
    <div class="dots">
        <div class="dot r" onclick="goBack()" title="Назад до пошуку"></div>
        <div class="dot y"></div>
        <div class="dot g"></div>
    </div>
    <span class="browser-protocol">SB_PROTOCOL://SECURE_CONNECTION_OK</span>
</div>

<div class="search-container" id="main-search">
    <div class="logo">SB Search</div>
    <div class="sub-logo">Secure Browser Engine</div>
    
    <div class="search-box">
        <input type="text" id="query" class="search-input" placeholder="Введіть ключове слово для пошуку...">
        <button class="search-btn" onclick="startSearch()">Пошук</button>
    </div>

    <div class="error-message" id="search-error">
        🚫 Результатів не знайдено. Скористайтеся швидким доступом нижче.
    </div>

    <div class="popular-box">
        <div class="popular-title">🔥 Швидкий доступ до мереж:</div>
        <div class="links-grid">
            <span class="fake-link" onclick="openSite('gdps.html')">🌐 GDPS Network (Kocmoc / Sonik / Voilt)</span>
            <span class="fake-link" onclick="openSite('maus.html')">🚜 Проект Taschenratte 11 LVL // Опис</span>
            <span class="fake-link" onclick="openSite('t22.html')">🎰 Бліц-Архіви: Т-22 ср.</span>
            <span class="fake-link" onclick="openSite('acid.html')">🧪 Екстрений Протокол "SULFURIC ACID"</span>
        </div>
    </div>
</div>

<div class="site-view-container" id="view-container">
    <button class="back-btn" onclick="goBack()">← Назад до пошуку</button>
    <iframe class="site-frame" id="browser-iframe" src=""></iframe>
</div>

<script src="script.js"></script>
</body>
</html>
